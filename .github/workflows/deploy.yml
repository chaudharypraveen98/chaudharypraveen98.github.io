name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'projects/**'
      - '*.html'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'robots.txt'
      - '.github/workflows/**'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site with Astro
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
